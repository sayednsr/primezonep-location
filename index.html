<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>PrimeZone Location</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">
<script defer src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#17202a;font-family:Arial,"Noto Sans",sans-serif}
.wrap{max-width:760px;margin:auto;padding:16px 12px 28px}.brand{font-size:26px;font-weight:800;margin:2px 2px 3px}
.sub{font-size:13px;color:#68717d;margin:0 2px 14px}.card{background:#fff;border:1px solid #e2e6ea;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 4px 18px rgba(0,0,0,.05)}
#map{height:370px;width:100%;background:#e8ebef}.pad{padding:14px}
button{display:block;width:100%;padding:14px 16px;border-radius:13px;border:1px solid #dfe3e8;background:#fff;color:#17202a;font-size:16px;font-weight:700}
#locate{background:#17202a;color:#fff;border-color:#17202a}#save{margin-top:9px}button:disabled{opacity:.5}
.status{min-height:22px;margin:10px 2px 0;font-size:14px;color:#68717d;line-height:1.4}.ok{color:#16803c}.err{color:#c62828}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.item{border:1px solid #e2e6ea;border-radius:12px;padding:10px}
.label{font-size:12px;color:#68717d;margin-bottom:5px}.value{font-size:14px;font-weight:700;word-break:break-word}
.hint{font-size:12px;color:#68717d;line-height:1.5;margin:10px 2px 0}.zonebox{padding:13px;border:1px dashed #cfd5dc;border-radius:13px;background:#fafbfc;font-size:14px;line-height:1.5}
.zonebox b{display:block;font-size:15px;margin-bottom:4px}@media(max-width:480px){#map{height:330px}}
</style>
</head>
<body>
<div class="wrap">
<div class="brand">PrimeZone</div><div class="sub">Delivery location</div>
<div class="card"><div id="map"></div><div class="pad">
<button id="locate" type="button">Use My Current Location</button>
<button id="save" type="button" disabled>Save Location</button>
<div id="status" class="status">Ready</div>
<div class="hint">After your location appears, tap any point on the map to measure the straight-line distance.</div>
</div></div>
<div class="card"><div class="pad"><div class="grid">
<div class="item"><div class="label">Latitude</div><div id="lat" class="value">—</div></div>
<div class="item"><div class="label">Longitude</div><div id="lng" class="value">—</div></div>
<div class="item"><div class="label">Accuracy</div><div id="acc" class="value">—</div></div>
<div class="item"><div class="label">Distance</div><div id="dist" class="value">—</div></div>
</div></div></div>
<div class="card"><div class="pad"><div class="zonebox"><b>PrimeZone Area</b>
The real PrimeZone zone boundaries will be connected here after the GPS flow is confirmed.
</div></div></div>
</div>
<script>
(function(){
"use strict";
var SUPABASE_URL="https://uwijvvyxxsdurtzsfyiwo.supabase.co";
var SUPABASE_KEY="sb_publishable_HxmpnBJKs9WpW47QKtbPqQ_K5_Kf7Fd";
var current=null,map=null,currentMarker=null,targetMarker=null;
function $(id){return document.getElementById(id)}
function setStatus(message,type){$("status").textContent=message;$("status").className="status "+(type||"")}
function distanceMeters(lat1,lng1,lat2,lng2){
var R=6371000,rad=Math.PI/180,p1=lat1*rad,p2=lat2*rad,dp=(lat2-lat1)*rad,dl=(lng2-lng1)*rad;
var a=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
return 2*R*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))
}
function updateMapLocation(){
if(!map||!current||!window.maplibregl)return;
if(currentMarker)currentMarker.remove();
currentMarker=new maplibregl.Marker({color:"#16803c"}).setLngLat([current.longitude,current.latitude]).addTo(map);
map.flyTo({center:[current.longitude,current.latitude],zoom:16,essential:true})
}
function getLocation(){
if(!navigator.geolocation){setStatus("GPS is not supported by this browser.","err");return}
$("locate").disabled=true;setStatus("Getting location...");
navigator.geolocation.getCurrentPosition(function(position){
current={latitude:position.coords.latitude,longitude:position.coords.longitude,accuracy:position.coords.accuracy};
$("lat").textContent=current.latitude.toFixed(6);$("lng").textContent=current.longitude.toFixed(6);
$("acc").textContent=Math.round(current.accuracy)+" m";$("dist").textContent="—";$("save").disabled=false;
updateMapLocation();setStatus("Location received","ok");$("locate").disabled=false
},function(error){
setStatus("GPS error"+(error&&error.message?": "+error.message:""),"err");$("locate").disabled=false
},{enableHighAccuracy:true,timeout:20000,maximumAge:0})
}
async function saveLocation(){
if(!current)return;$("save").disabled=true;setStatus("Saving to Supabase...");
try{
var response=await fetch(SUPABASE_URL+"/rest/v1/gps_test",{method:"POST",
headers:{"Content-Type":"application/json","apikey":SUPABASE_KEY,"Prefer":"return=minimal"},
body:JSON.stringify({test_id:"PRIMEZONE-GPS-"+Date.now(),latitude:current.latitude,longitude:current.longitude,accuracy:current.accuracy})});
if(!response.ok)throw new Error((await response.text())||("HTTP "+response.status));
setStatus("Location saved successfully","ok")
}catch(error){setStatus("Save error: "+(error.message||error),"err");$("save").disabled=false}
}
function initMap(){
if(!window.maplibregl){setStatus("Map service is unavailable. GPS can still be used.");return}
try{
map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[31.2357,30.0444],zoom:10,attributionControl:true});
map.addControl(new maplibregl.NavigationControl(),"top-right");
map.on("load",function(){if(!current)setStatus("Map ready")});
map.on("error",function(){if(!current)setStatus("Map could not load. GPS is still available.")});
map.on("click",function(event){
if(!current){setStatus("Get your location first.");return}
if(targetMarker)targetMarker.remove();
targetMarker=new maplibregl.Marker({color:"#17202a"}).setLngLat([event.lngLat.lng,event.lngLat.lat]).addTo(map);
var meters=distanceMeters(current.latitude,current.longitude,event.lngLat.lat,event.lngLat.lng);
$("dist").textContent=meters<1000?Math.round(meters)+" m":(meters/1000).toFixed(2)+" km"
})
}catch(error){console.error(error);map=null;if(!current)setStatus("Map could not load. GPS is still available.")}
}
$("locate").addEventListener("click",getLocation);$("save").addEventListener("click",saveLocation);
window.addEventListener("load",initMap)
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PrimeZone - إنشاء حساب</title>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!--
Required table for the location step (run once in Supabase SQL editor):

create table if not exists public.customer_locations (
  id uuid primary key default gen_random_uuid(),
  auth_user_id uuid not null unique references auth.users(id) on delete cascade,
  latitude double precision not null,
  longitude double precision not null,
  accuracy double precision,
  source text not null check (source in ('gps','manual')),
  created_at timestamptz not null default now(),
  updated_at timestamptz not null default now()
);
alter table public.customer_locations enable row level security;
create policy "Users can read own location" on public.customer_locations
  for select to authenticated using (auth.uid() = auth_user_id);
create policy "Users can create own location" on public.customer_locations
  for insert to authenticated with check (auth.uid() = auth_user_id);
create policy "Users can update own location" on public.customer_locations
  for update to authenticated using (auth.uid() = auth_user_id) with check (auth.uid() = auth_user_id);
-->
<style>
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font-family:"Segoe UI",Tahoma,Arial,sans-serif;background:#f7f8fa;color:#17202a}
.wrap{max-width:560px;margin:auto;padding:18px}
.card{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,.06)}
h1{margin:0 0 4px;font-size:24px}h2{margin:0 0 6px;font-size:19px}
.sub{color:#667085;margin:0 0 14px;line-height:1.6}
.bar{height:6px;background:#e5e7eb;border-radius:3px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;width:33%;background:#16a34a;transition:width .3s}
label{display:block;font-weight:600;margin:12px 0 5px}
input{width:100%;border:1px solid #d0d5dd;border-radius:12px;padding:13px;font-size:16px;font-family:inherit;background:#fff}
input:focus,button:focus-visible{outline:3px solid #86efac;outline-offset:1px}
.ltr{direction:ltr;text-align:left}
button{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:12px;font-family:inherit}
button:disabled{opacity:.55;cursor:not-allowed}
.dark{background:#111827;color:#fff}.green{background:#16a34a;color:#fff}.plain{background:#f2f4f7;color:#344054}
#map{width:100%;height:340px;border-radius:14px;overflow:hidden;direction:ltr;margin-top:12px}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}
.label{color:#667085}.value{font-weight:600;word-break:break-word}
#status{padding:11px;border-radius:10px;background:#f2f4f7;color:#344054;line-height:1.6}
#status.ok{background:#ecfdf3;color:#067647}#status:empty{display:none}
</style>
</head>
<body>
<div class="wrap">

<div class="card">
<h1>PrimeZone</h1>
<div class="sub" id="stepLabel">الخطوة 1 من 2: بيانات الحساب</div>
<div class="bar"><i id="barFill"></i></div>
</div>

<div class="card" id="step_account">
<h2 id="accTitle">إنشاء حساب جديد</h2>
<form id="accountForm">
<div id="signupOnly">
<label for="name">الاسم الكامل</label>
<input id="name" autocomplete="name" required>
<label for="phone">رقم الموبايل</label>
<input id="phone" class="ltr" type="tel" inputmode="tel" autocomplete="tel" pattern="[0-9+ ]{8,15}" required>
</div>
<label for="email">البريد الإلكتروني</label>
<input id="email" class="ltr" type="email" autocomplete="email" required>
<label for="password">كلمة المرور</label>
<input id="password" class="ltr" type="password" minlength="8" autocomplete="new-password" required>
<button class="dark" id="accBtn" type="submit">إنشاء الحساب</button>
</form>
<button class="plain" id="modeBtn" type="button">لدي حساب بالفعل، تسجيل الدخول</button>
</div>

<div class="card" id="step_location" hidden>
<h2>حدّد موقع التوصيل</h2>
<p class="sub">استخدم موقعك الحالي، أو اضغط على الخريطة لوضع الدبوس ثم اسحبه لتعديل المكان.</p>
<button class="dark" id="gpsBtn" type="button" style="margin-top:0">استخدم موقعي الحالي</button>
<div id="map"></div>
<div style="margin-top:10px">
<div class="row"><span class="label">خط العرض</span><span class="value" id="lat">-</span></div>
<div class="row"><span class="label">خط الطول</span><span class="value" id="lng">-</span></div>
<div class="row"><span class="label">طريقة التحديد</span><span class="value" id="src">-</span></div>
</div>
<button class="green" id="saveBtn" type="button" disabled>حفظ الموقع وإنهاء التسجيل</button>
</div>

<div class="card" id="step_done" hidden>
<h2>تم إنشاء حسابك</h2>
<p class="sub">تم حفظ موقعك بنجاح، ويمكنك الآن البدء في الطلب.</p>
<button class="plain" id="outBtn" type="button">تسجيل الخروج</button>
</div>

<div id="status" role="status" aria-live="polite"></div>
</div>

<script>
const SUPABASE_URL="https://uwijvyvxsdurtzsfyiwo.supabase.co";
const SUPABASE_KEY="sb_publishable_HxmpnBJKs9WpW47QKtbPqQ_K5_Kf7Fd";
const LOCATION_TABLE="customer_locations";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
let mode="signup",user=null,map=null,marker=null,point=null;

function say(m,ok){const s=$("status");s.textContent=m||"";s.className=ok?"ok":""}
function msg(e){const m=(e&&e.message)||String(e);
 if(/invalid login/i.test(m))return"البريد الإلكتروني أو كلمة المرور غير صحيحة.";
 if(/already registered/i.test(m))return"هذا البريد مسجّل بالفعل، سجّل الدخول بدلًا من ذلك.";
 if(/email not confirmed/i.test(m))return"أكّد بريدك الإلكتروني من الرابط الذي وصلك، ثم سجّل الدخول.";
 return m}

function show(step){
 ["account","location","done"].forEach(k=>$("step_"+k).hidden=k!==step);
 $("barFill").style.width={account:"33%",location:"66%",done:"100%"}[step];
 $("stepLabel").textContent={account:"الخطوة 1 من 2: بيانات الحساب",location:"الخطوة 2 من 2: موقع التوصيل",done:"اكتمل التسجيل"}[step]}

function setMode(m){mode=m;const up=m==="signup";
 $("signupOnly").hidden=!up;$("name").required=up;$("phone").required=up;
 $("accTitle").textContent=up?"إنشاء حساب جديد":"تسجيل الدخول";
 $("accBtn").textContent=up?"إنشاء الحساب":"تسجيل الدخول";
 $("modeBtn").textContent=up?"لدي حساب بالفعل، تسجيل الدخول":"ليس لدي حساب، إنشاء حساب جديد";
 $("password").autocomplete=up?"new-password":"current-password"}
$("modeBtn").addEventListener("click",()=>{say("");setMode(mode==="signup"?"signin":"signup")});

async function setOnboarding(patch){
 const{error}=await sb.from("account_onboarding").upsert({auth_user_id:user.id,...patch},{onConflict:"auth_user_id"});
 if(error)throw error}

async function route(){
 const{data:{session}}=await sb.auth.getSession();
 if(!session)return show("account");
 user=session.user;
 const{data,error}=await sb.from("account_onboarding").select("status").eq("auth_user_id",user.id).maybeSingle();
 if(error)return say("تعذّر تحميل حالة التسجيل: "+msg(error));
 if(data&&data.status==="completed")return show("done");
 await setOnboarding({status:"in_progress",current_step:"location"});
 openLocation()}

$("accountForm").addEventListener("submit",async e=>{e.preventDefault();
 const btn=$("accBtn"),email=$("email").value.trim(),password=$("password").value;
 btn.disabled=true;say("جارٍ المعالجة…");
 try{
  if(mode==="signup"){
   const{data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:$("name").value.trim(),phone:$("phone").value.trim()}}});
   if(error)throw error;
   if(!data.session){setMode("signin");return say("تم إنشاء الحساب. أكّد بريدك الإلكتروني من الرابط الذي وصلك، ثم سجّل الدخول من هنا لإكمال الخطوة التالية.",true)}
  }else{
   const{error}=await sb.auth.signInWithPassword({email,password});
   if(error)throw error}
  say("");await route()
 }catch(err){say(msg(err))}finally{btn.disabled=false}});

function openLocation(){show("location");say("");
 if(map)return map.resize();
 map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/liberty",center:[31.2357,30.0444],zoom:11});
 map.addControl(new maplibregl.NavigationControl(),"top-right");
 map.on("click",e=>place(e.lngLat.lng,e.lngLat.lat,null,"manual"))}

function place(lng,lat,accuracy,source){
 point={lat,lng,accuracy,source};
 if(marker)marker.setLngLat([lng,lat]);
 else{marker=new maplibregl.Marker({color:"#e11d48",draggable:true}).setLngLat([lng,lat]).addTo(map);
  marker.on("dragend",()=>{const p=marker.getLngLat();place(p.lng,p.lat,null,"manual")})}
 $("lat").textContent=lat.toFixed(6);$("lng").textContent=lng.toFixed(6);
 $("src").textContent=source==="gps"?`موقعي الحالي (دقة ${Math.round(accuracy)} متر)`:"حدّدته يدويًا على الخريطة";
 $("saveBtn").disabled=false}

$("gpsBtn").addEventListener("click",()=>{
 if(!navigator.geolocation)return say("المتصفح لا يدعم تحديد الموقع.");
 const b=$("gpsBtn");b.disabled=true;say("جارٍ تحديد موقعك…");
 navigator.geolocation.getCurrentPosition(p=>{b.disabled=false;
  const{latitude:la,longitude:lo,accuracy:ac}=p.coords;
  place(lo,la,ac,"gps");map.flyTo({center:[lo,la],zoom:16});
  say("تم تحديد موقعك. يمكنك سحب الدبوس لتعديله.",true)},
 e=>{b.disabled=false;
  say(e.code===1?"تم رفض إذن الموقع. فعّله من إعدادات المتصفح ثم حاول مرة أخرى.":e.code===3?"انتهت مهلة تحديد الموقع، حاول مرة أخرى.":"الموقع غير متاح. تأكد من تشغيل خدمة الموقع (GPS).")},
 {enableHighAccuracy:true,timeout:20000,maximumAge:0})});

$("saveBtn").addEventListener("click",async()=>{
 if(!point)return say("حدّد موقعك على الخريطة أولًا.");
 const b=$("saveBtn");b.disabled=true;say("جارٍ حفظ الموقع…");
 try{
  const{error}=await sb.from(LOCATION_TABLE).upsert({auth_user_id:user.id,latitude:point.lat,longitude:point.lng,accuracy:point.accuracy,source:point.source,updated_at:new Date().toISOString()},{onConflict:"auth_user_id"});
  if(error)throw error;
  await setOnboarding({status:"completed",current_step:"completed"});
  say("");show("done")
 }catch(err){console.error(err);say("تعذّر الحفظ: "+msg(err));b.disabled=false}});

$("outBtn").addEventListener("click",async()=>{await sb.auth.signOut();location.reload()});

setMode("signup");route();
</script>
</body>
</html>
